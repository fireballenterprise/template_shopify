---
name: Release
run-name: "Release"

# Thin caller — logic lives in fireballenterprise/workflows_shopify (floating major tag @v3).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Milestone bump on development before promoting'
        type: choice
        default: none
        options: [none, patch, minor, major]

jobs:
  release:
    # Called workflows can't elevate beyond the caller's grant, and the repo
    # default is read-only — promote pushes main, publish creates the Release
    permissions:
      contents: write
    uses: fireballenterprise/workflows_shopify/.github/workflows/release.yml@v3
    with:
      bump: ${{ inputs.bump }}
    secrets: inherit
