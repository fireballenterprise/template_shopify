---
name: Publish Release
run-name: "Publish Release"

# TEMPLATE REPO ONLY — delete this workflow in brand repos created from the
# template; they release through the reusable release.yml flow instead.
# The template has no development branch or store, so that flow can't run
# here. Bump VERSION in a PR; when it lands on main this tags the version
# (Fireball style, no v prefix) and publishes a GitHub Release.
# Re-run safe: exits early if the tag already exists.

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write  # push the tag and create the Release

jobs:
  publish_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Tag may exist without a Release (partial prior run), so check the tag,
      # not the Release. ls-remote avoids fetching full history for local tags.
      - name: Skip if already released
        id: guard
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.version }} already tagged — skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag release
        if: steps.guard.outputs.released != 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.guard.outputs.released != 'true'
        run: >-
          gh release create "${{ steps.version.outputs.version }}"
          --target main
          --title "${{ steps.version.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
