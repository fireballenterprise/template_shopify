---
name: Deploy
run-name: "Deploy to ${{ inputs.env || 'dev' }}"

# Thin caller — logic lives in fireballenterprise/workflows_shopify (floating major tag @v3).

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: false
        type: choice
        default: dev
        options:
          - dev
          - prd

jobs:
  deploy:
    uses: fireballenterprise/workflows_shopify/.github/workflows/deploy.yml@v3
    with:
      env: ${{ inputs.env || 'dev' }}
    secrets: inherit
